name: Fetch Figshare 477 pulse-wave files
# 提交本文件后会自动运行一次；也可在 Actions 页手动 Run workflow 重跑。
# 由 GITHUB_TOKEN 发起的 push 不会再次触发本 workflow（GitHub 防递归机制），不会死循环。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode embedded payload (480 file IDs + fetcher)
        run: |
          echo '' | base64 -d > files.tsv
          echo '' | base64 -d > fetch_all.py
          wc -l files.tsv
          python3 -m py_compile fetch_all.py

      - name: Download all files from Figshare and verify MD5
        run: python3 fetch_all.py

      - name: Commit packaged data back to this repository
        run: |
          git config user.name "figshare477-bot"
          git config user.email "figshare477-bot@users.noreply.github.com"
          git add figshare477_all.zip manifest.json README.md
          git commit -m "Add Figshare 477 pulse-wave files (CC BY 4.0)" || echo "nothing to commit"
          git push

      
